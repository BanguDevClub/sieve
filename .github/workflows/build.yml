name: Sieve CI/CD Matrix

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # 1. Linux GNU
          - name: Linux GNU (x86_64)
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact-name: sieve-linux-gnu

          # 2. Linux MUSL
          - name: Linux MUSL (x86_64)
            os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            artifact-name: sieve-linux-musl
            is-musl: true

          # 3. Windows AMD64
          - name: Windows (x86_64)
            os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact-name: sieve-windows-x64

          # 4. macOS Intel (AMD64)
          - name: macOS Intel (x86_64)
            os: macos-13
            target: x86_64-apple-darwin
            artifact-name: sieve-macos-x64

          # 5. macOS Apple Silicon (ARM64)
          - name: macOS Apple Silicon (ARM64)
            os: macos-14
            target: aarch64-apple-darwin
            artifact-name: sieve-macos-arm64

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: backend -> backend/target

      # Linux-specific dependencies
      - name: Install Linux Dependencies (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            musl-tools

      # Build Frontend
      - name: Install and Build Frontend
        run: |
          cd frontend
          npm ci || npm install
          npm run build
          cd ..

      # Build Linux MUSL standalone
      - name: Build Linux MUSL Standalone
        if: matrix.is-musl == true
        run: |
          cargo build --release --manifest-path backend/Cargo.toml --target ${{ matrix.target }} --bin sieve-core
          mkdir -p artifacts
          cp backend/target/${{ matrix.target }}/release/sieve-core artifacts/sieve-musl-standalone

      # Build Tauri GUI Application
      - name: Build Tauri Desktop Application
        if: matrix.is-musl != true
        run: |
          npm install -g @tauri-apps/cli
          cd backend
          cargo tauri build --target ${{ matrix.target }}
          cd ..
          mkdir -p artifacts
          find backend/target/${{ matrix.target }}/release/bundle/ -type f -exec cp {} artifacts/ \; 2>/dev/null || true
          find backend/target/${{ matrix.target }}/release/ -maxdepth 1 -type f \( -name "sieve" -o -name "sieve.exe" \) -exec cp {} artifacts/ \; 2>/dev/null || true

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact-name }}
          path: artifacts/*
          if-no-files-found: warn
